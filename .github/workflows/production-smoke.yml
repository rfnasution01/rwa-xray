name: Production release verification

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: HTTPS deployment origin
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      CMC_API_BASE_URL: https://pro-api.coinmarketcap.com
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require release credentials
        shell: bash
        run: |
          test -n "$CMC_API_KEY" || { echo "CMC_API_KEY is not configured"; exit 1; }
          test -n "$DATABASE_URL" || { echo "DATABASE_URL is not configured"; exit 1; }
      - name: Verify live CMC access and production database
        run: pnpm verify:live
      - name: Smoke deployed production
        run: pnpm smoke:production
